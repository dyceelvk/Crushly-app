# Crushly — Netlify deploy config.
# Netlify runs `npm run build` and publishes `dist/`.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Single-page app fallback so refresh and deep links keep working.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Vite emits hashed asset names, so they can be cached forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
