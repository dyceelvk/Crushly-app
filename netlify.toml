# Crushly — Netlify deploy config.
# This file makes Git-connected deploys work with zero manual settings:
# Netlify runs `npm run build` and publishes the `dist/` folder.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Single-page app fallback: always serve index.html (protects refresh/deep links).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Long-cache the hashed Vite assets for fast repeat loads.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
